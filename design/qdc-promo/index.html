<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Dungeon Crawler promo card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 900px; height: 1125px; overflow: hidden; }
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f8fafc;
      background:
        radial-gradient(circle at 76% 22%, rgba(20, 184, 166, .22), transparent 35%),
        radial-gradient(circle at 24% 78%, rgba(245, 158, 11, .18), transparent 38%),
        linear-gradient(145deg, #05080d 0%, #0b1320 54%, #101019 100%);
      position: relative;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .17;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
    }
    .card { position: relative; width: 100%; height: 100%; padding: 54px 54px 48px; }
    .accent-line {
      position: absolute; top: 72px; right: 55px; width: 324px; height: 4px;
      border-radius: 999px; background: linear-gradient(90deg, #f59e0b, #2dd4bf);
      box-shadow: 0 0 26px rgba(45, 212, 191, .42);
    }
    .brand { display: flex; align-items: center; gap: 16px; position: relative; z-index: 2; }
    .brand img { width: 78px; height: 78px; object-fit: contain; filter: drop-shadow(0 8px 20px rgba(45,212,191,.18)); }
    .brand-name { font-size: 27px; font-weight: 780; letter-spacing: -.02em; line-height: 1.05; }
    .byline { margin-top: 7px; color: #8e9aaa; font-size: 13px; font-weight: 650; letter-spacing: .07em; }
    .copy { position: absolute; left: 55px; top: 260px; width: 395px; z-index: 3; }
    .eyebrow { color: #5eead4; font-size: 15px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 20px 0 16px; font-size: 68px; line-height: .98; letter-spacing: -.055em; }
    h1 .gold { color: #fbbf24; }
    h1 .teal { color: #2dd4bf; }
    .sub { margin: 0; color: #b6c0ce; font-size: 22px; line-height: 1.42; max-width: 365px; }
    .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; width: 350px; }
    .badge {
      border: 1px solid rgba(148, 163, 184, .26); border-radius: 999px;
      padding: 9px 14px; color: #dce5ef; background: rgba(15, 23, 42, .68);
      font-size: 12px; font-weight: 800; letter-spacing: .08em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }
    .trust { margin-top: 28px; color: #7f8c9d; font-size: 13px; font-weight: 580; }
    .trust i { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 12px #2dd4bf; }
    .phone {
      position: absolute; right: 30px; top: 145px; width: 400px; height: 835px;
      padding: 13px; border-radius: 56px;
      background: linear-gradient(145deg, #3b4655, #111827 45%, #313947);
      border: 2px solid rgba(148, 163, 184, .35);
      box-shadow: 0 38px 90px rgba(0,0,0,.62), 0 0 50px rgba(45,212,191,.12), inset 0 1px 2px rgba(255,255,255,.35);
      transform: rotate(1.1deg);
      z-index: 2;
    }
    .screen { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; background: #000; }
    .screen img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 8%; filter: saturate(.92) contrast(1.06); }
    .screen::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 30px rgba(0,0,0,.72); pointer-events: none; }
    .speaker { position: absolute; top: 23px; left: 50%; width: 82px; height: 8px; transform: translateX(-50%); border-radius: 999px; background: rgba(8,12,18,.92); z-index: 4; }
    .battle-card {
      position: absolute; right: 320px; bottom: 145px; width: 206px; height: 300px;
      border: 1px solid rgba(148,163,184,.33); border-radius: 27px; overflow: hidden;
      background: #05070a; box-shadow: 0 24px 48px rgba(0,0,0,.62); transform: rotate(-4deg); z-index: 4;
    }
    .battle-card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; }
    .battle-label { position: absolute; left: 13px; bottom: 13px; padding: 7px 10px; border-radius: 999px; background: rgba(0,0,0,.82); color: #fbbf24; font-size: 10px; font-weight: 850; letter-spacing: .09em; }
    .footer { position: absolute; left: 55px; bottom: 50px; display: flex; align-items: center; gap: 14px; color: #c8d0dc; font-size: 15px; font-weight: 620; }
    .platform { padding: 8px 13px; border-radius: 9px; background: rgba(148,163,184,.12); color: #f8fafc; font-size: 11px; font-weight: 850; letter-spacing: .09em; }
  </style>
</head>
<body>
  <main class="card">
    <div class="accent-line"></div>
    <header class="brand">
      <img src="logo.webp" alt="">
      <div><div class="brand-name">Quick Dungeon<br>Crawler</div><div class="byline">BY WERKSTATTL</div></div>
    </header>

    <section class="copy">
      <div class="eyebrow">Casual roguelite</div>
      <h1>Loot.<br><span class="gold">Die.</span><br><span class="teal">Repeat.</span></h1>
      <p class="sub">Explore, adapt your build, and grow stronger with every run.</p>
      <div class="badges">
        <span class="badge">OFFLINE PLAY</span>
        <span class="badge">NO ADS</span>
        <span class="badge">OPEN SOURCE</span>
      </div>
      <p class="trust"><i></i>Play at your pace · Your run, your build</p>
    </section>

    <div class="phone" aria-hidden="true">
      <div class="speaker"></div>
      <div class="screen"><img src="exploring.webp" alt=""></div>
    </div>
    <div class="battle-card" aria-hidden="true">
      <img src="combat.webp" alt="">
      <span class="battle-label">ACTUAL GAME UI</span>
    </div>

    <footer class="footer"><span class="platform">ANDROID + WEB</span><span>Available on Google Play and in your browser</span></footer>
  </main>
</body>
</html>
